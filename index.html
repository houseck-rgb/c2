<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>최우영고기야 야채 발주 리스트</title>

<link rel="icon" type="image/png" href="./icon-v9.png?v=9">
<link rel="shortcut icon" type="image/png" href="./icon-v9.png?v=9">

<link rel="apple-touch-icon"
      sizes="180x180"
      href="./icon-v9.png?v=9">

<link rel="manifest" href="./manifest.json?v=9">

<meta name="apple-mobile-web-app-title" content="최우영고기야">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eeedE8;
  --card:#f7f5ef;
  --line:#d3d5cf;
  --text:#222a25;
  --muted:#707772;
  --green:#416b52;
  --green-dark:#315540;
  --green-soft:#e2ebe4;
  --red:#e84b3c;
  --shadow:0 2px 10px rgba(30,40,34,.045);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;padding:0 0 110px;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit}
button{touch-action:manipulation}

/* Header */
.hdr{
  background:rgba(248,247,242,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:0 16px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:80;
}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-ico{
  width:38px;height:38px;border-radius:12px;
  background:var(--green-soft);display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.hdr-title{font-weight:900;font-size:18px;color:var(--text);letter-spacing:-.5px}
.hdr-date{font-size:12px;font-weight:700;color:var(--muted)}

/* Quick links */
.quick-links{
  max-width:560px;margin:12px auto 0;padding:0 12px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px
}
.quick-link{
  display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:7px 5px;
  border:1px solid var(--line);border-radius:14px;
  background:#f8f7f2;color:#39423e;font-size:12px;font-weight:800;
  text-decoration:none;white-space:nowrap;box-shadow:0 2px 8px rgba(20,40,28,.035)
}
.quick-link:active{transform:scale(.97);background:#f3f6f4}

/* Hero */
.hero{
  max-width:560px;margin:12px auto 0;padding:20px 18px;
  background:#f8f7f2;border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);text-align:left;
}
.hero-sub{font-size:10px;letter-spacing:2px;color:var(--green);font-weight:900;text-transform:uppercase;margin-bottom:5px}
.hero-title{font-size:25px;font-weight:900;letter-spacing:-1px;color:#202823}
.hero-title span{color:var(--green)}
.hero-date{font-size:12px;color:var(--muted);margin-top:5px}
#heroTime{color:var(--green)!important;font-weight:800!important}
.hero-cnt{
  display:inline-flex;align-items:center;margin-top:12px;
  background:var(--green-soft);border:0;border-radius:999px;
  padding:6px 12px;font-size:12px;font-weight:900;color:var(--green-dark)
}

/* Main */
.wrap{max-width:560px;margin:0 auto;padding:18px 12px}
.slbl{
  font-size:14px;letter-spacing:-.2px;color:#313a35;font-weight:900;
  margin:4px 4px 10px;display:flex;align-items:center;gap:8px
}
.slbl::after{content:'';flex:1;height:1px;background:var(--line)}

/* Cards/table */
.tcard{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow)
}
.thead-row{
  display:grid;grid-template-columns:1fr 164px;
  background:#fafbfa;border-bottom:1px solid var(--line);padding:10px 14px
}
.thead-cell{font-size:11px;font-weight:800;color:var(--muted)}
.thead-cell.c{text-align:center}

.vrow{
  display:grid;grid-template-columns:minmax(0,1fr) 164px;
  border-bottom:1px solid #edf0ee;align-items:center;
  min-height:66px;background:#f8f7f2;transition:.15s
}
.vrow:last-child{border-bottom:none}
.vrow.filled{background:var(--green-soft);box-shadow:inset 4px 0 0 var(--green)}
.vrow-name{
  padding:10px 12px;display:flex;align-items:center;gap:10px;
  font-size:15px;font-weight:800;min-width:0;letter-spacing:-.25px
}
.vrow-emo{
  width:34px;height:34px;border-radius:10px;background:#f4f6f5;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0
}
.vrow.filled .vrow-emo{background:#f3f4ef}
.vrow-ctrl{
  padding:7px 8px;display:grid;grid-template-columns:46px 60px 46px;
  align-items:center;justify-content:end;gap:5px
}

/* Big touch controls */
.qbtn{
  width:46px;height:46px;border-radius:14px;
  border:1px solid #d5dad5;background:#f4f4ef;color:#35403a;
  font-size:25px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  user-select:none;box-shadow:0 1px 4px rgba(20,40,28,.04)
}
.qbtn:active{transform:scale(.90);background:#dbe8de;color:var(--green-dark);border-color:#9fb5a6}
.qin{
  width:60px;height:46px;background:#efefea;border:1px solid #dfe4e1;
  border-radius:13px;color:#4f5a54;font-size:19px;font-weight:900;
  text-align:center;outline:none;transition:.15s;
  -moz-appearance:textfield
}
.qin::-webkit-outer-spin-button,.qin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qin.has{background:#f6f7f2;border:2px solid var(--green);color:var(--green-dark)}
.qin:focus{border:2px solid var(--green);background:#f6f7f2}

/* Memo */
#memo{
  width:100%!important;min-height:88px!important;background:#f8f7f2!important;
  border:1px solid var(--line)!important;border-radius:16px!important;
  color:var(--text)!important;font-size:14px!important;
  padding:14px!important;outline:none!important;resize:none!important;
  margin-bottom:22px!important;box-shadow:var(--shadow)
}
#memo:focus{border:2px solid var(--green)!important}

/* Preview */
.prev-box{
  background:#f8f7f2;border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:20px;min-height:76px;box-shadow:var(--shadow)
}
.prev-empty{font-size:13px;color:#9aa19d;text-align:center;padding:10px 0}
.prev-txt{font-size:13px;color:#3f4944;white-space:pre-wrap;word-break:break-word;line-height:1.8}

/* Action buttons */
.share-btn{
  width:100%;height:60px;background:var(--green);border:0;border-radius:17px;
  color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:10px;box-shadow:0 3px 10px rgba(79,118,95,.16)
}
.share-btn:active{transform:scale(.98);background:var(--green-dark)}
.copy-btn{
  width:100%;height:50px;background:#f8f7f2;border:1px solid var(--line);
  border-radius:15px;color:#3c4741;font-size:14px;font-weight:800;
  cursor:pointer;margin-bottom:10px
}
.copy-btn:active{background:#f3f6f4}
.reset-btn{
  width:100%;height:46px;background:transparent;border:1px solid #e4e7e5;
  border-radius:15px;color:#8b938f;font-size:13px;font-weight:700;cursor:pointer
}
.reset-btn:active{color:var(--red);background:#f8f7f2}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#17201b;color:#fff;font-size:13px;font-weight:700;
  padding:11px 20px;border-radius:999px;box-shadow:0 8px 25px rgba(0,0,0,.18);
  transition:transform .3s;z-index:999;white-space:nowrap
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:390px){
  .thead-row,.vrow{grid-template-columns:minmax(0,1fr) 150px}
  .vrow-ctrl{grid-template-columns:42px 56px 42px;gap:4px;padding-left:2px;padding-right:6px}
  .qbtn{width:42px;height:44px}
  .qin{width:56px;height:44px}
  .vrow-name{font-size:14px;padding-left:10px;gap:7px}
  .vrow-emo{width:30px;height:30px;font-size:18px}
  .quick-link{font-size:11px}
  .hero{margin-left:12px;margin-right:12px}
}
</style>

</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <span class="hdr-ico">🥬</span>
    <div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:8px;letter-spacing:4px;color:var(--gold4);text-transform:uppercase">최우영고기야</div>
      <div class="hdr-title">야채 발주</div>
    </div>
  </div>
  <div class="hdr-date" id="hdrDate"></div>
</div>

<div class="quick-links">
  <a class="quick-link" href="https://c3-lovat-five.vercel.app/">🥩 고기리스트</a>
  <a class="quick-link" href="https://c4-ochre.vercel.app/">🍜 소스리스트</a>
  <a class="quick-link" href="https://gogiyastafflist.vercel.app/">📋 매장리스트</a>
</div>

<div class="hero">
  <div class="hero-sub">Vegetable Order List</div>
  <div class="hero-title">오늘의 <span>야채 발주</span></div>
  <div class="hero-date" id="heroDate"></div>
  <div class="hero-date" id="heroTime" style="color:var(--green-c);font-weight:700">⏰ 발주시간 --:--</div>
  <div class="hero-cnt" id="heroCnt">0개 입력</div>
</div>

<div class="wrap">
  <div class="slbl">🥬 야채 리스트</div>

  <div class="tcard">
    <div class="thead-row">
      <div class="thead-cell">품목</div>
      <div class="thead-cell c">발주 수량</div>
    </div>
    <div id="vegBody"></div>
  </div>

  <div class="slbl">📦 택배 발주 리스트</div>

  <div class="tcard">
    <div class="thead-row">
      <div class="thead-cell">품목</div>
      <div class="thead-cell c">발주 수량</div>
    </div>
    <div id="packBody"></div>
  </div>

  <div class="slbl">📝 메모</div>
  <textarea id="memo" placeholder="특이사항, 요청사항..." style="width:100%;min-height:64px;background:var(--bg3);border:1px solid rgba(200,150,10,.15);border-radius:var(--r);color:var(--ivory);font-size:13px;font-family:'Noto Sans KR',sans-serif;padding:12px 14px;outline:none;resize:none;margin-bottom:20px;transition:border-color .2s"></textarea>

  <div class="slbl">📋 미리보기</div>
  <div class="prev-box">
    <div id="prev" class="prev-empty">수량을 입력하면 여기에 메시지가 표시됩니다.</div>
  </div>

  <button class="share-btn" onclick="doShare()">📤 발주 리스트 보내기</button>
  <button class="copy-btn" onclick="doCopy()">📋 텍스트 복사</button>
  <button class="reset-btn" onclick="doReset()">↺ 전체 초기화</button>
</div>

<div class="toast" id="toast"></div>

<script>
const ITEMS = [
  {name:'무우',    emoji:'⬜'},
  {name:'양파',    emoji:'🧅'},
  {name:'대파',    emoji:'🌿'},
  {name:'청양고추',emoji:'🌶️'},
  {name:'오이고추',emoji:'🥒'},
  {name:'알배추',  emoji:'🥬'},
  {name:'오이',    emoji:'🥒'},
  {name:'배',      emoji:'🍐'},
  {name:'상추',    emoji:'🥗'},
  {name:'깻잎',    emoji:'🌿'},
  {name:'계란',    emoji:'🥚'},
  {name:'두부',    emoji:'⬜'},
  {name:'적근대',  emoji:'🌱'},
  {name:'깐마늘',  emoji:'🧄'},
  {name:'애호박',  emoji:'🥒'},
  {name:'알마늘',  emoji:'🧄'},
  {name:'산고추',  emoji:'🌶️'},
  {name:'버터',    emoji:'🧈'},
  {name:'사과주스',emoji:'🧃'},
  {name:'참숯',    emoji:'🪨'},
  {name:'메밀 김가루', emoji:'🌾'},
  {name:'고춧가루', emoji:'🌶️'},
];

const PACK_ITEMS = [
  {name:'쌀',     emoji:'🌾'},
  {name:'냉면면', emoji:'🍜'},
  {name:'김치',   emoji:'🥬'},
  {name:'둥근포장용기(찌개)', emoji:'📦'},
  {name:'사각포장용기(고기)', emoji:'📦'},
  {name:'투명비닐봉투', emoji:'🛍️'},
  {name:'쓰레기봉투', emoji:'🛍️'},
  {name:'주방세제', emoji:'🧴'},
  {name:'오븐클리너', emoji:'🧴'},
  {name:'비고', emoji:'🚫'},
  {name:'비고', emoji:'🚫'},
];

let data = ITEMS.map(v => ({...v, qty: 0}));
let packData = PACK_ITEMS.map(v => ({...v, qty: 0}));

// 날짜
function setDate() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];

  const hour = String(d.getHours()).padStart(2,'0');
  const minute = String(d.getMinutes()).padStart(2,'0');
  const time = `${hour}:${minute}`;

  const str = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  const short = `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;

  document.getElementById('hdrDate').textContent = short;
  document.getElementById('heroDate').textContent = str;

  const heroTime = document.getElementById('heroTime');
  if (heroTime) {
    heroTime.textContent = `⏰ 발주시간: ${time}`;
  }
}
setDate();
setInterval(setDate, 30000);

// 렌더
function render() {
  const body = document.getElementById('vegBody');
  body.innerHTML = '';
  data.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'vrow' + (item.qty > 0 ? ' filled' : '');

    // 품목명
    const nm = document.createElement('div');
    nm.className = 'vrow-name';
    nm.innerHTML = `<span class="vrow-emo">${item.emoji}</span>${item.name}`;

    // 수량 컨트롤
    const ctrl = document.createElement('div');
    ctrl.className = 'vrow-ctrl';

    const bm = document.createElement('button');
    bm.className = 'qbtn'; bm.textContent = '−';
    bm.onclick = () => { data[i].qty = Math.max(0, data[i].qty - 1); render(); };

    const inp = document.createElement('input');
    inp.type = 'number'; inp.min = '0';
    inp.className = 'qin' + (item.qty > 0 ? ' has' : '');
    inp.placeholder = '0';
    inp.value = item.qty > 0 ? item.qty : '';
    inp.addEventListener('input', () => {
      const n = parseFloat(inp.value);
      data[i].qty = (isNaN(n) || n < 0) ? 0 : n;
      inp.className = 'qin' + (data[i].qty > 0 ? ' has' : '');
      updateCnt(); buildPreview();
    });

    const bp = document.createElement('button');
    bp.className = 'qbtn'; bp.textContent = '+';
    bp.onclick = () => { data[i].qty += 1; render(); };

    ctrl.append(bm, inp, bp);
    row.append(nm, ctrl);
    body.appendChild(row);
  });
  updateCnt(); buildPreview();
}

function renderPack() {
  const body = document.getElementById('packBody');
  if (!body) return;
  body.innerHTML = '';
  packData.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'vrow' + (item.qty > 0 ? ' filled' : '');

    const nm = document.createElement('div');
    nm.className = 'vrow-name';
    nm.innerHTML = `<span class="vrow-emo">${item.emoji}</span>${item.name}`;

    const ctrl = document.createElement('div');
    ctrl.className = 'vrow-ctrl';

    const bm = document.createElement('button');
    bm.className = 'qbtn'; bm.textContent = '−';
    bm.onclick = () => { packData[i].qty = Math.max(0, packData[i].qty - 1); renderPack(); };

    const inp = document.createElement('input');
    inp.type = 'number'; inp.min = '0';
    inp.className = 'qin' + (item.qty > 0 ? ' has' : '');
    inp.placeholder = '0';
    inp.value = item.qty > 0 ? item.qty : '';
    inp.addEventListener('input', () => {
      const n = parseFloat(inp.value);
      packData[i].qty = (isNaN(n) || n < 0) ? 0 : n;
      inp.className = 'qin' + (packData[i].qty > 0 ? ' has' : '');
      updateCnt(); buildPreview();
    });

    const bp = document.createElement('button');
    bp.className = 'qbtn'; bp.textContent = '+';
    bp.onclick = () => { packData[i].qty += 1; renderPack(); };

    ctrl.append(bm, inp, bp);
    row.append(nm, ctrl);
    body.appendChild(row);
  });
  updateCnt(); buildPreview();
}

function updateCnt() {
  const cnt = data.filter(i => i.qty > 0).length + packData.filter(i => i.qty > 0).length;
  document.getElementById('heroCnt').textContent = `${cnt}개 입력`;
}

// 메시지 빌드
function buildMsg() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];

  const hour = String(d.getHours()).padStart(2,'0');
  const minute = String(d.getMinutes()).padStart(2,'0');
  const time = `${hour}:${minute}`;

  const filled = data.filter(i => i.qty > 0);
  const packFilled = packData.filter(i => i.qty > 0);

  if (!filled.length && !packFilled.length) return null;

  let msg =
`최우영고기야 야채 발주 리스트
${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})
발주시간: ${time}
━━━━━━━━━━━━━━

`;

  filled.forEach(i => {
    msg += `  ${i.name}: ${i.qty}\n`;
  });

  if (packFilled.length) {
    msg += `\n택배 발주 리스트\n`;
    packFilled.forEach(i => {
      msg += `  ${i.name}: ${i.qty}\n`;
    });
  }

  const memo = document.getElementById('memo').value.trim();

  if (memo) {
    msg += `\n메모\n${memo}\n`;
  }

  return msg + '━━━━━━━━━━━━━━';
}

function buildPreview() {
  const el = document.getElementById('prev');
  const msg = buildMsg();
  if (!msg) {
    el.className = 'prev-empty';
    el.textContent = '수량을 입력하면 여기에 메시지가 표시됩니다.';
  } else {
    el.className = 'prev-txt';
    el.textContent = msg;
  }
}
document.getElementById('memo').addEventListener('input', buildPreview);

// 공유
async function doShare() {
  const msg = buildMsg();
  if (!msg) {
    showToast('⚠️ 수량을 먼저 입력해주세요');
    return;
  }

  // 텍스트 자체를 바로 공유합니다. 파일 첨부 방식은 사용하지 않습니다.
  if (navigator.share) {
    try {
      await navigator.share({
        title: '최우영고기야 야채 발주 리스트',
        text: msg
      });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }

  // 공유 기능을 지원하지 않는 환경에서는 자동 복사
  await copyText(msg);
  showToast('📋 리스트가 복사되었습니다. 카카오톡에 붙여넣어 주세요');
}

async function doCopy() {
  const msg = buildMsg();
  if (!msg) { showToast('⚠️ 수량을 먼저 입력해주세요'); return; }
  await copyText(msg);
  showToast('📋 복사 완료!');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch(e){}
  const el = document.createElement('textarea');
  el.value = text; document.body.appendChild(el); el.select();
  document.execCommand('copy'); document.body.removeChild(el);
}

function doReset() {
  if (!confirm('전체 수량을 초기화할까요?')) return;
  data = ITEMS.map(v => ({...v, qty:0}));
  packData = PACK_ITEMS.map(v => ({...v, qty:0}));
  document.getElementById('memo').value = '';
  render();
  renderPack();
  showToast('↺ 초기화 완료');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

render();
renderPack();
</script>
